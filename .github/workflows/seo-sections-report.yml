name: SEO sections report

# Ejecuta el validador de secciones del home en cada push y PR.
# - El validador se corre como `prebuild` antes de Vite, así que un fallo
#   aborta el build con exit 1.
# - Pase o falle el build, el reporte (HTML + JSON) se genera siempre en
#   dist/seo-sections-report.* y se sube como artefacto de CI.
#   En builds fallidos, esto permite descargar el reporte para diagnosticar
#   qué sección rompe el contrato de SEO/accesibilidad.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-report:
    name: Build + SEO sections report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Generamos el reporte SIEMPRE primero (incluso si el prebuild del
      # `npm run build` fuera a fallar después). El script crea dist/ si
      # no existe y escribe el reporte aunque haya errores.
      - name: Generate SEO sections report
        id: seo_report
        run: npm run validate:sections
        continue-on-error: true

      # Build real. Si el validador encontró errores, el `prebuild` aborta
      # esta etapa con exit 1 y marcamos el job como fallido al final.
      - name: Build project
        id: build
        run: npm run build
        continue-on-error: true

      # Confirmamos que el reporte existe (defensa por si el build limpió dist/).
      - name: Ensure report exists
        if: always()
        run: |
          if [ ! -f dist/seo-sections-report.html ] || [ ! -f dist/seo-sections-report.json ]; then
            echo "Reporte ausente tras el build, regenerando..."
            npm run validate:sections || true
          fi
          ls -la dist/seo-sections-report.* || true

      - name: Upload SEO sections report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-sections-report
          path: |
            dist/seo-sections-report.html
            dist/seo-sections-report.json
          if-no-files-found: warn
          retention-days: 30

      # Resumen visible directamente en la pestaña "Summary" del run.
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## 🔎 SEO sections report"
            echo ""
            if [ -f dist/seo-sections-report.json ]; then
              node -e "
                const r = require('./dist/seo-sections-report.json');
                const t = r.totals;
                console.log('**Estado global:** ' + (r.status === 'pass' ? '✅ PASS' : '❌ FAIL'));
                console.log('');
                console.log('| Métrica | Valor |');
                console.log('|---|---|');
                console.log('| Secciones | ' + t.sections + ' |');
                console.log('| OK | ' + t.sectionsOk + ' |');
                console.log('| Con errores | ' + t.sectionsWithErrors + ' |');
                console.log('| Con avisos | ' + t.sectionsWithWarnings + ' |');
                console.log('| Errores totales | ' + t.errors + ' |');
                console.log('| Avisos totales | ' + t.warnings + ' |');
                if (t.errors > 0) {
                  console.log('');
                  console.log('### Secciones con errores');
                  console.log('');
                  for (const s of r.sections.filter(s => s.errors.length)) {
                    console.log('- **' + s.file + '** (#' + (s.id || '—') + ')');
                    for (const e of s.errors) console.log('  - ' + e);
                  }
                }
              " >> "$GITHUB_STEP_SUMMARY"
            else
              echo "_No se encontró dist/seo-sections-report.json_" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo ""
            echo "📦 Descargá el reporte completo en la sección **Artifacts** de este run (\`seo-sections-report\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Si el validador o el build fallaron, marcamos el job como fallido
      # ahora — después de haber subido el reporte como artefacto.
      - name: Fail job if validator or build failed
        if: steps.seo_report.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          echo "::error::Validator outcome=${{ steps.seo_report.outcome }} | Build outcome=${{ steps.build.outcome }}"
          exit 1